services:
  - type: worker
    name: ai-multi-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: FORCE_JOIN_CHANNEL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
